services:
  mysql:
    image: mysql:8.0
    container_name: learnflow-db
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: learnflow
      MYSQL_USER: learnflow
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - learnflow_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  learnflow_data:
